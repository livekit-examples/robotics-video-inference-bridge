[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-processor"
version = "0.1.0"
description = "Cloud processor for edge CV - runs SAM 3.1 segmentation on video streams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit>=0.18",
    "livekit-api>=0.8",
    "sam3",
    "torch",
    "pillow",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "setuptools<84",
    "importlib-resources>=6.5.2",
    "einops>=0.8.2",
    "torchvision>=0.25.0",
    "decord>=0.6.0",
    "pycocotools>=2.0.11",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# FA3 requires H100 GPU with CUDA 12.3+
flash = ["flash-attn-3"]

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }
flash-attn-3 = { git = "https://github.com/Dao-AILab/flash-attention.git", subdirectory = "hopper" }

[tool.uv.extra-build-dependencies]
flash-attn-3 = ["torch", "ninja"]

[tool.setuptools.packages.find]
where = ["src"]